# Dependabot version updates for fint-admin-portal-frontend-v2
# Ecosystems: npm (app), docker (runtime image), github-actions (CI/CD)
version: 2

updates:
  # ── npm / package-lock.json ───────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    # Let newly published versions settle before opening PRs (security updates ignore this)
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 2
    groups:
      # Security first — batch non-major security fixes into one PR
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["patch", "minor"]

      # Keep React Router packages on the same version
      react-router:
        applies-to: version-updates
        patterns:
          - "react-router"
          - "@react-router/*"

      # React runtime + matching type packages
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

      # Aksel / Navikt design system
      navikt:
        applies-to: version-updates
        patterns:
          - "@navikt/*"

      # Build tooling
      vite-tailwind:
        applies-to: version-updates
        patterns:
          - "vite"
          - "vite-*"
          - "tailwindcss"
          - "@tailwindcss/*"

      # E2E / mock stack
      testing:
        applies-to: version-updates
        patterns:
          - "cypress"
          - "msw"
          - "start-server-and-test"
          - "wait-on"

      # Remaining production deps (minor/patch only — majors stay individual)
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]

      # Remaining dev deps (minor/patch only)
      development-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # ── Docker base image (Dockerfile FROM node:…) ────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ── GitHub Actions in .github/workflows ───────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
